<!DOCTYPE html>
<html lang="en" data-theme="aia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Keep the archived deck out of search and image indexes. Third-party
       image-rights enforcement runs on reverse-image crawlers, so staying
       unindexed removes the discovery path. See CREDITS.md. Note this meta tag
       is the mechanism that actually works here: robots.txt is only read from
       the domain root, and this site lives on the /my-presentation/ subpath. -->
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <title>GenAI-Codeforce</title>
  <link rel="icon" href="assets/brand/logo.png">
  <link rel="stylesheet" href="styles.css">

  <!-- Mobile lite mode. Injected by scripts/publish-deck.ps1, not part of the
       archived edition: the deck is built for a laptop on a projector and
       mobile Safari kills the tab rather than render one. See
       public/decks/_lite/deck-lite.js. -->
  <link rel="stylesheet" href="../_lite/deck-lite.css">
  <script src="../_lite/deck-lite.js"></script>
</head>
<body>
  <!-- animated background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__mesh"><i></i></div>
    <div class="bg__grid"></div>
    <div class="bg__vignette"></div>
    <div class="bg__noise"></div>
  </div>

  <!-- top HUD -->
  <header class="hud">
    <div class="hud__brand">
      <img src="assets/brand/logo.png" alt="GenAI-Codeforce">
      <div><b>GenAI-Codeforce</b> <span id="count"></span></div>
    </div>
    <div class="hud__right">
      <span class="aia-plate" title="Part of AI Austria"><img src="assets/brand/ai-austria.png" alt="AI Austria"></span>
      <span class="hud__clock" id="clock"></span>
    </div>
  </header>

  <!-- slides are generated by engine.js -->
  <main class="deck" id="deck"></main>

  <!-- subtle slide-progress line -->
  <div class="progress" id="progress" aria-hidden="true"><span class="progress__bar"></span></div>

  <!-- nav hint + on-screen arrows -->
  <div class="hint">
    <button id="nav-prev" class="kbd" title="Back" style="cursor:pointer">‹</button>
    <button id="nav-next" class="kbd" title="Next" style="cursor:pointer">›</button>
    <span><span class="kbd">→</span> next · <span class="kbd">T</span> theme · <span class="kbd">K</span> jump</span>
  </div>

  <!-- meme lightbox -->
  <div class="lightbox" id="lightbox">
    <figure class="lb-fig">
      <img alt="meme enlarged">
      <figcaption class="lb-cap" hidden><b class="lb-cap__t"></b><span class="lb-cap__b"></span></figcaption>
    </figure>
  </div>

  <!-- command palette -->
  <div class="cmdk" id="cmdk">
    <div class="cmdk__box">
      <input class="cmdk__in" id="cmdk-in" placeholder="Jump to a slide…  (↑↓ then Enter)" autocomplete="off">
      <div class="cmdk__list" id="cmdk-list"></div>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="content.js"></script>
  <script src="engine.js"></script>

  <!-- Cover FX modules (self-contained; each waits for the deck, injects its own
       CSS, and is theme-aware). Remove any line to disable that effect. -->
  <script src="fx/entrance.js"></script>     <!-- boot-up takeover + Fable vanish glitch -->
  <script src="fx/ambient.js"></script>      <!-- token rain + parallax tilt -->
  <script src="fx/interactive.js"></script>  <!-- click emoji burst + Konami RAVE MODE -->
  <script src="fx/hud.js"></script>          <!-- breaking-news ticker + 72h vanish clock -->
  <script src="fx/personality.js"></script>  <!-- AI hype meter + snarky AI orb -->

  <!-- Slide 5 (the "intro" slide) FX modules. Same self-contained pattern as
       the cover FX above: each is a guarded IIFE, injects its own scoped CSS,
       rAF-waits for .slide[data-id="intro"], is theme-aware, and only runs
       while that slide is active. Remove any line to disable that effect. -->
  <script src="fx/intro-decrypt.js"></script>       <!-- 1. decrypt/scramble headline reveal -->
  <script src="fx/intro-roulette.js"></script>      <!-- 2. goal-chip slot-machine roulette -->
  <script src="fx/intro-constellation.js"></script> <!-- 3. neural-constellation canvas backdrop -->
  <script src="fx/intro-tilt.js"></script>          <!-- 4. panel 3D tilt + cursor spotlight -->
  <script src="fx/intro-counter.js"></script>       <!-- 5. live "builders shipping" counter + sparkline -->
  <script src="fx/intro-flip.js"></script>          <!-- 6. flip-card facts -->
  <script src="fx/intro-eq.js"></script>            <!-- 7. synthwave equalizer footer -->
  <script src="fx/intro-stamp.js"></script>         <!-- 8. dbl-click title -> rubber-stamp + confetti -->
  <script src="fx/intro-tagline.js"></script>       <!-- 9. rotating tagline flipper -->
  <script src="fx/intro-crt.js"></script>           <!-- 10. retro CRT-mode toggle -->
</body>
</html>
